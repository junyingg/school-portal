name: school-portal

services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_portal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm env:init first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run pnpm env:init first}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?run pnpm env:init first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: school-portal-api
    command: ["node", "dist/db/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://school_portal_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-school_portal}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: school-portal-api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://school_portal_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-school_portal}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CORS_ALLOWED_ORIGINS: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/readyz").then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: school-portal-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
