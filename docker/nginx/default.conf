limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /api {
    default_type "application/json; charset=utf-8";
    return 404 '{"error":"Not found"}';
  }

  location /api/ {
    limit_req zone=api burst=200 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;

    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_intercept_errors off;

    error_page 413 @request_too_large;
    error_page 429 @too_many_requests;
    error_page 502 @bad_gateway;
    error_page 503 @service_unavailable;
    error_page 504 @gateway_timeout;
  }

  location @request_too_large {
    default_type "application/json; charset=utf-8";
    return 413 '{"error":"Request body too large"}';
  }

  location @too_many_requests {
    default_type "application/json; charset=utf-8";
    return 429 '{"error":"Too many requests"}';
  }

  location @bad_gateway {
    default_type "application/json; charset=utf-8";
    return 502 '{"error":"Service unavailable"}';
  }

  location @service_unavailable {
    default_type "application/json; charset=utf-8";
    return 503 '{"error":"Service unavailable"}';
  }

  location @gateway_timeout {
    default_type "application/json; charset=utf-8";
    return 504 '{"error":"Service unavailable"}';
  }

  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
  }
}
